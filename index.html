  <style>
    body {
      font-family: 'Open Sans', 'Noto Sans Mongolian', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      touch-action: manipulation;
    }
    h1, h2, h3, .heading-font {
      font-family: 'Montserrat', 'Noto Sans Mongolian', sans-serif;
    }
    .slide-card {
      transition: all 0.25s ease-out;
    }
    .slide-enter {
      opacity: 0;
      transform: translateY(10px) scale(0.98);
    }
    .slide-active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden select-none">

        1 / 25
      </span>
      <button onclick="toggleSidebar()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
        <i class="fa-solid fa-list-ul text-sm"></i>
      </button>

  </div>

  <!-- Main Slide Canvas -->

    <div id="slide-container" class="w-full max-w-4xl h-full max-h-[600px] bg-slate-900/90 border border-slate-800 rounded-2xl p-4 md:p-8 shadow-2xl flex flex-col justify-between backdrop-blur-sm relative overflow-y-auto custom-scrollbar slide-card slide-active">
      <!-- Slide Content -->
    </div>

    <div id="sidebar" class="fixed right-0 top-0 bottom-0 w-72 md:w-80 bg-slate-900 border-l border-slate-800 z-50 transform translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">

      </div>
      <div class="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar" id="sidebar-list"></div>
    </div>
  </main>

  <footer class="bg-slate-900/95 backdrop-blur border-t border-slate-800 px-4 py-3 flex items-center justify-between z-40 relative">
    <button id="prev-btn" onclick="prevSlide()" class="px-4 py-2.5 rounded-xl bg-slate-800 active:bg-slate-700 text-slate-200 text-xs md:text-sm font-semibold flex items-center space-x-2 transition disabled:opacity-30 disabled:cursor-not-allowed">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Өмнөх</span>
    </button>

    <div class="flex items-center space-x-2">
      <select id="slide-select" onchange="goToSlide(parseInt(this.value))" class="bg-slate-800 text-slate-200 border border-slate-700 rounded-lg px-2 py-1 text-xs outline-none focus:border-emerald-500 max-w-[140px] md:max-w-none">

    </div>

      <span>Дараах</span>

    </button>

      },
      {

      },

        subtitle: "Ирээдүйд үлдээх хариуцлага",
        content: `

      },
      {

        tag: "ТӨГСГӨЛ",
        title: "Анхаарал тавьсанд баярлалаа!",
        subtitle: "Асуулт ба хариулт",
        content: `
          <div class="flex-1 flex flex-col justify-center items-center text-center space-y-3 my-auto">

              <i class="fa-solid fa-circle-check"></i>
            </div>
            <h2 class="text-xl font-extrabold text-white heading-font">Танилцуулга дууслаа</h2>
            <p class="text-slate-400 text-xs max-w-sm">
              Байгаль дэлхийгээ хайрлан хамгаалж, биологийн олон янз байдлыг авч үлдэхэд хамтдаа хувь нэмэр оруулцгаая!

              Асуулт хариулт

          </div>
        `
      }
    ];

    let currentSlide = 0;

    function renderSlide(index) {
      const slide = slidesData[index];
      const container = document.getElementById('slide-container');

      container.classList.remove('slide-active');
      container.classList.add('slide-enter');

      setTimeout(() => {
        if (index === 0) {
          container.innerHTML = `
            ${slide.content}
            <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between text-[10px] text-slate-500">
              <span>Биологийн олон янз байдал</span>
              <span>1 / ${slidesData.length}</span>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div>
              <div class="flex items-center justify-between mb-1">
                <span class="text-[9px] font-bold tracking-widest text-emerald-400 uppercase bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
                  ${slide.tag}
                </span>
                <span class="text-[10px] text-slate-500">№ ${slide.id}</span>
              </div>
              <h3 class="text-base md:text-xl font-bold text-white heading-font">${slide.title}</h3>
              <p class="text-[11px] text-slate-400 mt-0.5">${slide.subtitle}</p>
            </div>
            
            ${slide.content}

            <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between text-[10px] text-slate-500">
              <span>Биологийн олон янз байдал</span>
              <span>${slide.id} / ${slidesData.length}</span>
            </div>
          `;
        }

        container.classList.remove('slide-enter');
        container.classList.add('slide-active');
      }, 80);

      document.getElementById('slide-counter').innerText = `${index + 1} / ${slidesData.length}`;
      document.getElementById('progress-bar').style.width = `${((index + 1) / slidesData.length) * 100}%`;

      document.getElementById('prev-btn').disabled = index === 0;
      document.getElementById('next-btn').disabled = index === slidesData.length - 1;

      document.getElementById('slide-select').value = index;

      updateSidebarActive(index);
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function goToSlide(index) {
      currentSlide = index;
      renderSlide(currentSlide);
    }

    function initSidebar() {
      const list = document.getElementById('sidebar-list');
      const select = document.getElementById('slide-select');

      slidesData.forEach((slide, idx) => {
        const item = document.createElement('div');
        item.className = `p-2 rounded-lg border text-xs cursor-pointer transition flex items-center justify-between sidebar-item-${idx}`;
        item.onclick = () => {
          goToSlide(idx);
          toggleSidebar();
        };
        
        const titleText = idx === 0 ? "Биологийн олон янз байдал" : slide.title;
        item.innerHTML = `
          <div class="truncate mr-2">
            <span class="font-bold block text-slate-200">${idx + 1}. ${titleText}</span>
            <span class="text-[9px] text-slate-400">${slide.tag}</span>
          </div>
        `;
        list.appendChild(item);

        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = `${idx + 1}. ${titleText}`;
        select.appendChild(opt);
      });
    }

    function updateSidebarActive(activeIndex) {
      slidesData.forEach((_, idx) => {
        const item = document.querySelector(`.sidebar-item-${idx}`);
        if (item) {
          if (idx === activeIndex) {
            item.className = `p-2 rounded-lg border text-xs cursor-pointer transition flex items-center justify-between sidebar-item-${idx} bg-emerald-500/20 border-emerald-500/50 text-emerald-300`;
          } else {
            item.className = `p-2 rounded-lg border text-xs cursor-pointer transition flex items-center justify-between sidebar-item-${idx} bg-slate-800/50 border-slate-700/50 text-slate-300 active:bg-slate-800`;
          }
        }
      });
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('translate-x-full');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Утасны дэлгэц дээр хуруугаар чирж шилжүүлэх (Swipe Support)
    let touchStartX = 0;
    let touchEndX = 0;
    const mainArea = document.getElementById('main-touch-area');

    mainArea.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    mainArea.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, false);

    function handleSwipe() {
      if (touchEndX < touchStartX - 50) {
        nextSlide(); // Зүүн тийш шудрахад дараагийн слайд
      }
      if (touchEndX > touchStartX + 50) {
        prevSlide(); // Баруун тийш шудрахад өмнөх слайд
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      }
    });

    window.onload = () => {
      initSidebar();
      renderSlide(0);
    };
  </script>
